name: PR Validation to develop

on:
  pull_request:
    branches: [ "develop" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm v10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile deduplication
        run: pnpm dedupe --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Run unit & component tests
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Build Storybook documentation
        run: pnpm storybook:build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload compiled library bundle
        uses: actions/upload-artifact@v4
        with:
          name: library-dist-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7

      - name: Upload compiled Storybook preview
        uses: actions/upload-artifact@v4
        with:
          name: storybook-preview-${{ github.event.pull_request.number }}
          path: storybook-static/
          retention-days: 7
